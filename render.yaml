# Render Blueprint — free tier deploy for MedCounsel
# Dashboard: New → Blueprint → connect this repo
services:
  - type: web
    name: medcounsel
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install && npm run db:generate && (cd packages/database && DATABASE_URL=file:./prisma/prod.db npx prisma db push) && DATABASE_URL=file:./packages/database/prisma/prod.db npm run fix-dnb-degrees --workspace=@medcounsel/data-ingestion && npm run build
    startCommand: npm run start --workspace=@medcounsel/web
    healthCheckPath: /login
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        value: file:./packages/database/prisma/prod.db
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_URL
        sync: false
      - key: ALLOWED_USERS
        sync: false
      - key: AUTH_DEFAULT_PASSWORD
        sync: false
